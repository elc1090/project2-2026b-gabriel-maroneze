<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoLocate</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <img src="/static/images/ecolocateLogo.png" alt="Logo do EcoLocate" class="logo">
        <h1>EcoLocate</h1>

        <p>Encontre os pontos de coleta mais próximos de você!</p>
    </header>

    <main>

        <section aria-labelledby="titulo-listagem">
            <div class="cabecalho-listagem">
                <h2 id="titulo-listagem">
                    Pontos de coleta disponíveis
                </h2>

                <button id="btn-load" type="button">
                    Carregar pontos
                </button>
                <div class="filtro">
                    <label for="filtro">Filtrar por materiais:</label>

                    <select id="filtro-materiais" multiple size="5"></select>
                    <button id="btn-filtrar" type="button">Filtrar</button>
                    <button id="btn-limpar" type="button">Limpar filtro</button>
            </div>

            <p id="msg-load" class="msg-load">
                Clique no botão para verificar os pontos de coleta disponíveis.
            </p>

            <div id="lista-pontos" class="lista-pontos"></div>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>



</html>
