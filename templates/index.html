<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoLocate</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header>
        <img src="/static/images/ecolocateLogo.png" alt="Logo do EcoLocate" class="logo">
        <h1>EcoLocate</h1>

        <p>Encontre os pontos de coleta mais próximos de você!</p>
    </header>

    <main>

        <section aria-labelledby="titulo-listagem">
            <div class="filtro">
                <label for="filtro-materiais">
                    Filtrar por materiais:
                </label>
                <select id="filtro-materiais" multiple size="5"></select>

                <div class="acoes-filtro">
                    <button id="btn-filtrar" class="btn-filtrar">
                        Filtrar
                    </button>

                    <button id="btn-limpar" class="btn-limpar">
                        Limpar
                    </button>
                </div>
            </div>

            <div class="cabecalho-listagem">
                <h2 id="titulo-listagem">Pontos de Coleta Disponíveis</h2>
                <button id="btn-load" class="btn-load">
                    Atualizar pontos
                </button>   
            </div>

            <p id="msg-load" class="msg-load">
                Carregando...
            </p>

            <div id="lista-pontos" class="lista-pontos"></div>
        </section>
    </main>

    <script src="/static/script.js"></script>
</body>



</html>
