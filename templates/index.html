<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoLocate</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <header class="cabecalho-site">
        <div class="marca-site">
            <img src="/static/images/ecolocateLogo.png" alt="Logo do EcoLocate" class="logo">

            <div class="texto-marca">
                <h1>EcoLocate</h1>

                <p>
                    Encontre os pontos de coleta mais próximos de você!
                </p>
            </div>
        </div>
    </header>

    <main>
        <section class="painel-controles" aria-label="Controles da Listagem">
            <div class="filtro-dropdown" id="filtro-dropdown">
                <h2 class="titulo-filtro">
                    Filtrar por materiais:
                </h2>

                <button
                    id="btn-abrir-filtro"
                    class="filtro-resumo"
                    type="button"
                    aria-expanded="false"
                    aria-controls="painel-filtro">
                    <span id="texto-filtro">
                        Selecionar materiais
                    </span>

                    <span class="seta-filtro" aria-hidden="true"></span>
                </button>

                <div id="painel-filtro" class="filtro-painel">
                    <div
                        id="opcoes-filtro"
                        class="opcoes-filtro"
                        role="group"
                        aria-label="Materiais disponíveis">

                    </div>

                    <div class="acoes-filtro">
                        <button id="btn-filtrar" type="button">
                            Aplicar
                        </button>

                        <button id="btn-limpar" type="button">
                            Limpar
                        </button>
                    </div>
                </div>
            </div>
                <button id="btn-load" class="btn-atualizar" type="button">
                    Atualizar pontos
                </button>
            </section>

            <section class="sessao-mapa" aria-labelledby="titulo-mapa">
                <div class="cabecalho-mapa">
                    <h2 id="titulo-mapa">
                        Mapa dos Pontos de Coleta
                    </h2>
                    <p> Selecione um marcador para visualizar o ponto </p>
                </div>

                <div id="mapa" role="region" aria-label="Mapa com os pontos cadastrados"></div>
            </section>

            <section class="sessao-listagem" aria-labelledby="titulo-listagem">
                <div class="cabecalho-listagem">
                    <h2 id="titulo-listagem">
                        Pontos de Coleta Disponíveis:
                    </h2>

                    <p id="msg-load" class="msg-load" aria-live="polite">
                        Carregando pontos...
                    </p>
                </div>

                <div id="lista-pontos" class="lista-pontos">
                </div>
        </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
    </script>

    <script src="/static/script.js"></script>
</body>

</html>
