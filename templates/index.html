<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoLocate</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>EcoLocate</h1>

        <p>Encontre os pontos de coleta mais próximos de você!</p>
    </header>

    <main>
        <section arial-labelledby="titulo-listagem">
            <div class="cabecalho-imagem">
                <h2 id="titulo-listagem">
                    Pontos de Coleta Disponiveis
                </h2>
                <button id="btn-load" type="button">
                    Carregar pontos
                </button>"
            </div>

            <p id="msg-load" class="msg-load">
                Clique no botão para verificar os pontos de coleta disponíveis
            </p>"

            <div id="lista-pontos" class="lista-pontos"></div>"
        </section>

    </main>
    
    <script src="script.js"></script>

</body>
</html>
